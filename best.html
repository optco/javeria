<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Best Agent of the Month - Awards Gallery</title>
  <meta name="description" content="Monthly sales and rental achievement awards">
  <meta name="author" content="Tanvir Akhtar">
  <meta name="theme-color" content="#6a11cb">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    .awards-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    
    .page-header {
      text-align: center;
      margin-bottom: 60px;
    }
    
    .page-header h1 {
      font-size: 3rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }
    
    .page-header p {
      font-size: 1.2rem;
      color: rgba(255,255,255,0.7);
    }
    
    .year-section {
      margin-bottom: 60px;
    }
    
    .year-header {
      font-size: 2.5rem;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 3px solid rgba(102, 126, 234, 0.3);
      color: #fff;
    }
    
    .months-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 30px;
    }
    
    .month-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 25px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    
    .month-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    
    .month-name {
      font-size: 1.8rem;
      font-weight: bold;
      margin-bottom: 20px;
      color: #fff;
      text-align: center;
    }
    
    .award-type {
      margin-bottom: 20px;
    }
    
    .award-label {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
      color: rgba(255,255,255,0.8);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .award-label i {
      color: #667eea;
    }
    
    .award-image {
      width: 100%;
      border-radius: 12px;
      aspect-ratio: 16/9;
      object-fit: cover;
      border: 2px solid rgba(102, 126, 234, 0.3);
    }
    
    .no-image {
      width: 100%;
      border-radius: 12px;
      aspect-ratio: 16/9;
      background: rgba(255,255,255,0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.3);
      border: 2px dashed rgba(255,255,255,0.1);
    }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      background: rgba(102, 126, 234, 0.2);
      border-radius: 50px;
      color: #fff;
      text-decoration: none;
      margin-bottom: 30px;
      transition: background 0.3s ease;
    }
    
    .back-link:hover {
      background: rgba(102, 126, 234, 0.4);
    }
    
    @media (max-width: 768px) {
      .page-header h1 {
        font-size: 2rem;
      }
      
      .year-header {
        font-size: 2rem;
      }
      
      .months-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark/light mode" title="Toggle theme">
  <span class="theme-icon sun"><i class="fas fa-sun"></i></span>
  <span class="theme-icon moon"><i class="fas fa-moon"></i></span>
</button>

<div class="bg-gradient"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="awards-container">
  <a href="index.html" class="back-link">
    <i class="fas fa-arrow-left"></i> Back to Profile
  </a>
  
  <div class="page-header">
    <h1><i class="fas fa-trophy"></i> Best Agent of the Month</h1>
    <p>Sales & Rental Achievement Awards</p>
  </div>

  <div id="awards-gallery"></div>
</div>

<script>
const months = [
  'January', 'February', 'March', 'April', 'May', 'June',
  'July', 'August', 'September', 'October', 'November', 'December'
];

const monthAbbrev = [
  '01', '02', '03', '04', '05', '06',
  '07', '08', '09', '10', '11', '12'
];

// Define which years to display
const years = [2025, 2024, 2023]; // Add more years as needed

function createMonthCard(year, monthIndex) {
  const monthName = months[monthIndex];
  const monthCode = monthAbbrev[monthIndex];
  const yearShort = year.toString().slice(-2);
  
  const saleImage = `sale${monthCode}${yearShort}.jpg`;
  const rentImage = `rent${monthCode}${yearShort}.jpg`;
  
  return `
    <div class="month-card">
      <h3 class="month-name">${monthName}</h3>
      
      <div class="award-type">
        <div class="award-label">
          <i class="fas fa-house"></i> Best Sale
        </div>
        <img src="${saleImage}" alt="${monthName} ${year} - Best Sale" class="award-image" onerror="this.outerHTML='<div class=\\'no-image\\'><i class=\\'fas fa-image\\' style=\\'font-size: 2rem;\\'></i></div>'">
      </div>
      
      <div class="award-type">
        <div class="award-label">
          <i class="fas fa-key"></i> Best Rental
        </div>
        <img src="${rentImage}" alt="${monthName} ${year} - Best Rental" class="award-image" onerror="this.outerHTML='<div class=\\'no-image\\'><i class=\\'fas fa-image\\' style=\\'font-size: 2rem;\\'></i></div>'">
      </div>
    </div>
  `;
}

function createYearSection(year) {
  let monthsHTML = '';
  
  for (let i = 0; i < 12; i++) {
    monthsHTML += createMonthCard(year, i);
  }
  
  return `
    <div class="year-section">
      <h2 class="year-header"><i class="fas fa-calendar"></i> ${year}</h2>
      <div class="months-grid">
        ${monthsHTML}
      </div>
    </div>
  `;
}

// Generate the gallery
const gallery = document.getElementById('awards-gallery');
let galleryHTML = '';

years.forEach(year => {
  galleryHTML += createYearSection(year);
});

gallery.innerHTML = galleryHTML;
</script>

<script src="javascript.js"></script>

</body>
</html>
