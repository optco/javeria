<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Best Agent of the Month - Awards Gallery</title>
  <meta name="theme-color" content="#D4AF37">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    /* =======================================
       BASE & VARIABLES
       ======================================= */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-gradient-start: #000000;
      --bg-gradient-end: #D4AF37;
      --glass-bg: rgba(255,255,255,0.12);
      --glass-bg-hover: rgba(255,255,255,0.18);
      --glass-border: rgba(255,255,255,0.35);
      --glass-shadow: rgba(31,38,135,0.25);
      --text-primary: #ffffff;
      --text-secondary: rgba(255,255,255,0.9);
      --text-muted: rgba(255,255,255,0.75);
      --text-dim: rgba(255,255,255,0.55);
      --link-bg: rgba(255,255,255,0.15);
      --link-bg-hover: rgba(255,255,255,0.35);
      --link-border: rgba(255,255,255,0.3);
      --btn-primary-bg: linear-gradient(135deg, #D4AF37, #AA8A26);
      --btn-primary-hover: linear-gradient(135deg, #E5C158, #C9A227);
      --transition-speed: 0.4s;
    }

    body {
      min-height: 100vh;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      overflow-x: hidden;
      background: var(--bg-gradient-start);
      color: var(--text-primary);
      line-height: 1.5;
    }

    /* STATIC BACKGROUND */
    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -2;
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      background-size: 100% 100%;
      background-position: center;
    }

    /* =======================================
       LAYOUT & COMPONENTS
       ======================================= */
    .awards-container { 
      max-width: 1200px; 
      margin: 0 auto; 
      padding: 40px 20px 110px; 
    }

    .back-link {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 12px 24px; 
      background: var(--link-bg);
      border: 1px solid var(--link-border);
      border-radius: 50px; color: var(--text-primary); text-decoration: none;
      margin-bottom: 30px; transition: background var(--transition-speed), transform 0.3s;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .back-link:hover { background: var(--link-bg-hover); transform: translateX(-4px); }

    .page-header { text-align: center; margin-bottom: 50px; }
    .page-header h1 {
      font-size: 2.8rem; color: var(--text-primary);
      text-shadow: 0 2px 20px rgba(0,0,0,0.3);
      margin-bottom: 10px;
    }
    .page-header h1 i { color: #D4AF37; margin-right: 10px; }
    .page-header p { font-size: 1.15rem; color: var(--text-secondary); }

    .year-section { margin-bottom: 22px; }
    .year-header {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      font-size: 1.9rem; font-weight: 700; color: var(--text-primary);
      background: var(--glass-bg); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--glass-border); border-radius: 16px;
      padding: 20px 28px; cursor: pointer; transition: background var(--transition-speed), border-color var(--transition-speed);
      font-family: inherit;
      box-shadow: 0 8px 32px var(--glass-shadow);
    }
    .year-header:hover { background: var(--glass-bg-hover); border-color: rgba(255,255,255,0.5); }
    .year-header .chev { transition: transform 0.4s; }
    .year-section.open .year-header .chev { transform: rotate(180deg); }

    .year-content { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.5s ease; }
    .year-section.open .year-content { grid-template-rows: 1fr; }
    .year-inner { overflow: hidden; min-height: 0; }

    .months-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 22px; padding: 25px 5px 10px;
    }

    .month-card {
      display: none;
      background: var(--glass-bg); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-radius: 16px; padding: 18px; border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px var(--glass-shadow);
      transition: background var(--transition-speed), transform 0.3s;
    }
    .month-card:hover { background: var(--glass-bg-hover); transform: translateY(-4px); }
    .month-card.has-image { display: block; }

    .month-name { font-size: 1.25rem; font-weight: 700; color: var(--text-primary); text-align: center; margin-bottom: 14px; }

    .awards-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .award-label {
      font-size: .72rem; text-transform: uppercase; letter-spacing: 1px;
      color: var(--text-secondary); margin-bottom: 8px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .award-label i { color: #D4AF37; }

    .award-image {
      width: 100%; aspect-ratio: 3 / 4; object-fit: cover;
      border-radius: 10px; border: 1px solid var(--glass-border);
      cursor: zoom-in; display: block;
      transition: transform 0.25s, box-shadow 0.25s;
    }
    .award-image:hover { transform: scale(1.05); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }

    .award-type.broken { display: none; }

    .awards-row.single { grid-template-columns: 1fr; }
    .awards-row.single .award-image { max-width: 60%; margin: 0 auto; }

    .empty-message {
      text-align: center; color: var(--text-dim);
      padding: 40px 20px; font-size: 1.1rem;
      display: none;
    }
    .empty-message.show { display: block; }

    /* LIGHTBOX */
    .lightbox {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); 
      display: none; align-items: center; justify-content: center;
      z-index: 2000; padding: 20px;
    }
    .lightbox.show { display: flex; }
    .lightbox img {
      max-width: min(92vw, 560px); max-height: 85vh;
      border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      border: 1px solid var(--glass-border);
    }
    .lightbox-close {
      position: absolute; top: 20px; right: 25px;
      width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--link-border);
      background: var(--link-bg); color: var(--text-primary);
      font-size: 1.2rem; cursor: pointer;
      transition: background 0.3s, transform 0.3s;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .lightbox-close:hover { background: var(--link-bg-hover); transform: rotate(90deg); }
    
    .lightbox-caption {
      position: absolute; bottom: 22px; left: 50%; transform: translateX(-50%);
      color: var(--text-secondary); font-size: 1rem;
      background: rgba(0,0,0,0.6); padding: 8px 20px;
      border-radius: 50px; white-space: nowrap;
      border: 1px solid var(--glass-border);
    }

    /* GO TO TOP */
    #go-top {
      position: fixed; right: 25px; bottom: 25px;
      width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--glass-border);
      background: var(--btn-primary-bg);
      color: #ffffff; font-size: 1.2rem; cursor: pointer;
      opacity: 0; visibility: hidden; transform: translateY(15px);
      transition: all 0.35s; z-index: 1500;
      box-shadow: 0 8px 24px rgba(212, 175, 55, 0.3);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    #go-top.show { opacity: 1; visibility: visible; transform: translateY(0); }
    #go-top:hover { background: var(--btn-primary-hover); transform: translateY(-4px); }

    @media (max-width: 600px) {
      .page-header h1 { font-size: 2rem; }
      .year-header { font-size: 1.4rem; padding: 16px 20px; }
      .awards-row.single .award-image { max-width: 80%; }
      #go-top { right: 15px; bottom: 15px; width: 46px; height: 46px; }
    }
  </style>
</head>
<body>

  <div class="bg-gradient"></div>

  <div class="awards-container">
    <a href="index.html" class="back-link">
      <i class="fas fa-arrow-left"></i> Back to Profile
    </a>

    <div class="page-header">
      <h1><i class="fas fa-trophy"></i> Best Agent of the Month</h1>
      <p>Sales &amp; Rental Achievement Awards</p>
    </div>

    <div id="awards-gallery"></div>
    <div class="empty-message" id="empty-msg">
      <i class="fas fa-inbox" style="font-size: 2.5rem; margin-bottom: 15px; display: block;"></i>
      No awards uploaded yet. Check back soon.
    </div>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close">
      <i class="fas fa-times"></i>
    </button>
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-caption" id="lightbox-caption"></div>
  </div>

  <button type="button" id="go-top" aria-label="Back to top" title="Back to top">
    <i class="fas fa-arrow-up"></i>
  </button>

  <script>
    const months = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];
    const monthAbbrev = ['01','02','03','04','05','06','07','08','09','10','11','12'];
    const years = [2026, 2025, 2024];

    function awardBlock(year, mIdx, type) {
      const src = 'awards/' + type + monthAbbrev[mIdx] + String(year).slice(-2) + '.jpg';
      const label = type === 'sale' ? 'Most Sales' : 'Most Rentals';
      const icon = type === 'sale' ? 'fa-house' : 'fa-key';
      const caption = label + ' ' + months[mIdx] + ' ' + year;
      return `
        <div class="award-type">
          <div class="award-label"><i class="fas ${icon}"></i> ${label}</div>
          <img src="${src}" alt="${caption}" class="award-image" loading="lazy">
        </div>`;
    }

    function createMonthCard(year, mIdx) {
      return `
        <div class="month-card" data-month="${mIdx}">
          <h3 class="month-name">${months[mIdx]}</h3>
          <div class="awards-row">
            ${awardBlock(year, mIdx, 'sale')}
            ${awardBlock(year, mIdx, 'rent')}
          </div>
        </div>`;
    }

    const gallery = document.getElementById('awards-gallery');
    gallery.innerHTML = years.map(year => `
      <div class="year-section" id="year-${year}">
        <button type="button" class="year-header" data-year="${year}" aria-expanded="false">
          <span><i class="fas fa-calendar"></i>&nbsp; ${year}</span>
          <i class="fas fa-chevron-down chev"></i>
        </button>
        <div class="year-content">
          <div class="year-inner">
            <div class="months-grid">
              ${Array.from({length: 12}, (_, i) => createMonthCard(year, i)).join('')}
            </div>
          </div>
        </div>
      </div>
    `).join('');

    let anyImageLoaded = false;

    gallery.querySelectorAll('.month-card').forEach(card => {
      const images = card.querySelectorAll('.award-image');
      let loadedCount = 0;
      let failedCount = 0;
      const total = images.length;

      function checkComplete() {
        if (loadedCount > 0) {
          card.classList.add('has-image');
          anyImageLoaded = true;
          if (loadedCount === 1) {
            card.querySelector('.awards-row').classList.add('single');
          }
        }
      }

      images.forEach(img => {
        const awardType = img.closest('.award-type');
        const onFail = () => {
          awardType.classList.add('broken');
          failedCount++;
          if (failedCount + loadedCount === total) checkComplete();
        };
        const onLoad = () => {
          loadedCount++;
          if (failedCount + loadedCount === total) checkComplete();
        };

        if (img.complete) {
          if (img.naturalWidth > 0) onLoad();
          else onFail();
        } else {
          img.addEventListener('load', onLoad);
          img.addEventListener('error', onFail);
        }
      });
    });

    window.addEventListener('load', () => {
      setTimeout(() => {
        document.querySelectorAll('.year-section').forEach(section => {
          const visibleCards = section.querySelectorAll('.month-card.has-image');
          if (visibleCards.length === 0) {
            section.style.display = 'none';
          }
        });
        if (!anyImageLoaded) {
          document.getElementById('empty-msg').classList.add('show');
        }
      }, 1500);
    });

    document.querySelectorAll('.year-header').forEach(btn => {
      btn.addEventListener('click', () => {
        const section = document.getElementById('year-' + btn.dataset.year);
        const open = section.classList.toggle('open');
        btn.setAttribute('aria-expanded', open);
      });
    });

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxCaption = document.getElementById('lightbox-caption');

    gallery.addEventListener('click', e => {
      const img = e.target.closest('.award-image');
      if (!img) return;
      const awardType = img.closest('.award-type');
      if (awardType && awardType.classList.contains('broken')) return;
      lightboxImg.src = img.src;
      lightboxImg.alt = img.alt;
      lightboxCaption.textContent = img.alt;
      lightbox.classList.add('show');
      document.body.style.overflow = 'hidden';
    });

    function closeLightbox() {
      lightbox.classList.remove('show');
      document.body.style.overflow = '';
    }
    document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    const goTop = document.getElementById('go-top');
    window.addEventListener('scroll', () => {
      goTop.classList.toggle('show', window.scrollY > 300);
    });
    goTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  </script>

  <script src="javascript.js"></script>
</body>
</html>
